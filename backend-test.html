<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Hub Backend Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      background: #111;
      color: #eee;
    }

    section {
      background: #1d1d1d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
    }

    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin: 8px 0;
    }

    button {
      padding: 10px 15px;
      margin: 5px 5px 5px 0;
      cursor: pointer;
    }

    #status {
      padding: 15px;
      background: #222;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .good {
      color: #5ee0a0;
    }

    .bad {
      color: #ff7777;
    }

    pre {
      background: #000;
      border-radius: 10px;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 120px;
    }
  </style>
</head>

<body>

  <h1>Student Hub Backend Test</h1>

  <div id="status">
    Loading Appwrite...
  </div>

  <section>
    <h2>1. Create account</h2>

    <input id="signupName" placeholder="Name">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">

    <button id="signupButton">Create account</button>
  </section>


  <section>
    <h2>2. Login</h2>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button id="loginButton">Login</button>
    <button id="whoButton">Who am I?</button>
    <button id="logoutButton">Logout</button>
  </section>


  <section>
    <h2>3. Semester database</h2>

    <button id="createSemesterButton">
      Create Fall 2026
    </button>

    <button id="loadSemestersButton">
      Load my semesters
    </button>
  </section>


  <h2>Output</h2>

  <pre id="output">Waiting...</pre>


  <!-- Current Appwrite browser SDK -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@28.1.0/dist/iife/sdk.js"></script>

  <script>
    (() => {

      const status = document.getElementById("status");
      const output = document.getElementById("output");


      function show(value) {

        output.textContent =
          typeof value === "string"
            ? value
            : JSON.stringify(value, null, 2);

      }


      function showError(error) {

        console.error(error);

        show({
          message: error.message,
          code: error.code || null,
          type: error.type || null
        });

      }


      // -----------------------------
      // CHECK SDK
      // -----------------------------

      if (!window.Appwrite) {

        status.innerHTML =
          '<span class="bad">❌ Appwrite SDK did not load.</span>';

        return;

      }


      if (typeof Appwrite.TablesDB !== "function") {

        status.innerHTML =
          '<span class="bad">❌ TablesDB is unavailable in the loaded SDK.</span>';

        show({
          TablesDB: typeof Appwrite.TablesDB,
          Account: typeof Appwrite.Account,
          Client: typeof Appwrite.Client
        });

        return;

      }


      // -----------------------------
      // APPWRITE CONFIGURATION
      // -----------------------------

      const awClient = new Appwrite.Client();

      awClient
        .setEndpoint("https://fra.cloud.appwrite.io/v1")
        .setProject("6ab9533600167cfe8598");


      const awAccount =
        new Appwrite.Account(awClient);

      const awTables =
        new Appwrite.TablesDB(awClient);


      const DATABASE_ID =
        "student_hub";

      const TABLE_ID =
        "semesters";


      status.innerHTML =
        '<span class="good">✅ Appwrite initialized successfully.</span>';


      // -----------------------------
      // CREATE ACCOUNT
      // -----------------------------

      document
        .getElementById("signupButton")
        .addEventListener("click", async () => {

          try {

            const result =
              await awAccount.create({

                userId: Appwrite.ID.unique(),

                email:
                  document
                    .getElementById("signupEmail")
                    .value
                    .trim(),

                password:
                  document
                    .getElementById("signupPassword")
                    .value,

                name:
                  document
                    .getElementById("signupName")
                    .value
                    .trim()

              });


            show({
              success: true,
              message:
                "Account created. Now log in below.",
              user: result
            });

          }
          catch (error) {

            showError(error);

          }

        });


      // -----------------------------
      // LOGIN
      // -----------------------------

      document
        .getElementById("loginButton")
        .addEventListener("click", async () => {

          try {

            const result =
              await awAccount
                .createEmailPasswordSession({

                  email:
                    document
                      .getElementById("loginEmail")
                      .value
                      .trim(),

                  password:
                    document
                      .getElementById("loginPassword")
                      .value

                });


            show({
              success: true,
              message:
                "Logged in successfully.",
              session: result
            });

          }
          catch (error) {

            showError(error);

          }

        });


      // -----------------------------
      // WHO AM I
      // -----------------------------

      document
        .getElementById("whoButton")
        .addEventListener("click", async () => {

          try {

            const user =
              await awAccount.get();

            show({
              success: true,
              user
            });

          }
          catch (error) {

            showError(error);

          }

        });


      // -----------------------------
      // LOGOUT
      // -----------------------------

      document
        .getElementById("logoutButton")
        .addEventListener("click", async () => {

          try {

            await awAccount.deleteSession({
              sessionId: "current"
            });

            show(
              "Logged out successfully."
            );

          }
          catch (error) {

            showError(error);

          }

        });


      // -----------------------------
      // CREATE SEMESTER
      // -----------------------------

      document
        .getElementById("createSemesterButton")
        .addEventListener("click", async () => {

          try {

            const user =
              await awAccount.get();


            const semester =
              await awTables.createRow({

                databaseId:
                  DATABASE_ID,

                tableId:
                  TABLE_ID,

                rowId:
                  Appwrite.ID.unique(),

                data: {

                  userId:
                    user.$id,

                  name:
                    "Fall 2026",

                  startDate:
                    "2026-09-01T00:00:00.000Z",

                  endDate:
                    "2026-12-20T00:00:00.000Z",

                  isActive:
                    true

                },

                permissions: [

                  Appwrite.Permission.read(
                    Appwrite.Role.user(user.$id)
                  ),

                  Appwrite.Permission.update(
                    Appwrite.Role.user(user.$id)
                  ),

                  Appwrite.Permission.delete(
                    Appwrite.Role.user(user.$id)
                  )

                ]

              });


            show({
              success: true,
              message:
                "Fall 2026 semester created.",
              semester
            });

          }
          catch (error) {

            showError(error);

          }

        });


      // -----------------------------
      // LOAD SEMESTERS
      // -----------------------------

      document
        .getElementById("loadSemestersButton")
        .addEventListener("click", async () => {

          try {

            const result =
              await awTables.listRows({

                databaseId:
                  DATABASE_ID,

                tableId:
                  TABLE_ID

              });


            show({
              success: true,
              count:
                result.total,
              semesters:
                result.rows
            });

          }
          catch (error) {

            showError(error);

          }

        });


    })();
  </script>

</body>
</html>
